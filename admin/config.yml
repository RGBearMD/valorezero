# Configurazione del CMS (generata da tools/extract.js: non modificare a mano, modificare tools/config.head.yml)
backend:
  name: github
  repo: RGBearMD/valorezero
  branch: main
  base_url: https://sveltia-cms-auth.fancy-hill-2c61.workers.dev
locale: it
publish_mode: simple
media_folder: public/img/upload
public_folder: /img/upload
collections:
  - name: pagine
    label: Testi delle pagine
    files:
      - name: "index"
        label: "Li uccidiamo a milioni. E li chiamiamo numeri."
        file: "content/index.json"
        fields:
          - label: Testi della pagina
            name: voci
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: "{{fields.ctx}} — {{fields.text}}"
            fields:
              - { label: Dove compare, name: ctx, widget: string, required: false, hint: "Sezione della pagina e tipo di blocco. Non modificare." }
              - { label: Testo, name: text, widget: markdown, buttons: [bold, italic, link], modes: [rich_text], editor_components: [] }
              - { label: "Autorizzo la modifica dei numeri in questo testo", name: cifre_ok, widget: boolean, default: false, required: false, hint: "Di norma lasciare spento: i numeri vengono dai dati verificati." }
              - { label: Id, name: id, widget: hidden }
              - { label: Originale, name: orig, widget: hidden }
