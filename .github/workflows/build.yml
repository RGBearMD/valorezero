name: Build e pubblicazione
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          STRICT: ""
          SITE_URL: https://valorezero.rgbear.it/
      - name: Pubblica sul ramo "dist" (da qui legge Cloudflare Pages)
        run: |
          cd dist
          git init -q -b dist
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
